version: "3.9"

services:

  api:
    image: python:3.12-slim
    container_name: veyqra-api
    working_dir: /app
    volumes:
      - ./apps/api:/app
    command: tail -f /dev/null
    ports:
      - "8000:8000"

  web:
    image: node:22
    container_name: veyqra-web
    working_dir: /app
    volumes:
      - ./apps/web:/app
    command: tail -f /dev/null
    ports:
      - "3000:3000"
