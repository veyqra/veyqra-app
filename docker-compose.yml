services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: veyqra-api
    restart: unless-stopped
    user: "${VEYQRA_UID:-1000}:${VEYQRA_GID:-1000}"
    environment:
      VEYQRA_API_HOST: 0.0.0.0
      VEYQRA_API_PORT: 8000
      VEYQRA_CORS_ORIGINS: "http://localhost:${VEYQRA_WEB_PORT:-3000},http://127.0.0.1:${VEYQRA_WEB_PORT:-3000}"
      VEYQRA_COMFYUI_URL: "${VEYQRA_COMFYUI_URL:-http://host.docker.internal:8188}"
      VEYQRA_PUBLIC_API_URL: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${VEYQRA_API_PORT:-8000}:8000"
    volumes:
      - ./apps/api/data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: veyqra-web
    restart: unless-stopped
    environment:
      VEYQRA_INTERNAL_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${VEYQRA_WEB_PORT:-3000}:3000"
