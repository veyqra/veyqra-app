name: Frontend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run lint --workspace=web

      - run: npm run build --workspace=web
